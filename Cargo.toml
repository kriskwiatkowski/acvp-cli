[package]
name = "acvp-cli"
version = "0.0.1"
edition = "2021"
authors = ["Krzysztof Kwiatkowski"]
description = "ACVP client for testing cryptographic implementations against KAT vectors"
license = "MIT OR Apache-2.0"
repository = "https://git.amongbytes.com/AmongBytes/acvp-cli"
homepage = "https://git.amongbytes.com/AmongBytes/acvp-cli"


[dependencies]
mlkem-ref = { path = "../mlkem-ref" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
thiserror = "1.0"
tokio = { version = "1.0", features = ["full"] }
reqwest = { version = "0.12", features = [
    "json",
    "rustls-tls",
], default-features = false }
base64 = "0.22"
hex = "0.4"
sha2 = "0.10"
hmac = "0.12"
totp-lite = "2.0"
x509-parser = "0.16"
zip = "0.6"
log = "0.4"
env_logger = "0.11"

[[bin]]
name = "acvp-cli"
path = "src/main.rs"

[[bin]]
name = "mlkem_wrapper"
path = "src/bin/mlkem_wrapper.rs"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.0"
tempfile = "3.8"
